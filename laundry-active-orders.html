<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Active Orders | TLogos</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

    <div class="logo">
        TLogos
    </div>

    <a
        href="laundry-dashboard.html"
        class="back-link"
    >
        ← Dashboard
    </a>

</header>



<main class="dashboard">


    <section class="dashboard-welcome">

        <h1>
            Active Orders 📦
        </h1>

        <p>
            Manage your customers' laundry orders.
        </p>

    </section>



    <section id="ordersContainer">

        <div class="dashboard-card">

            <p>
                Loading orders...
            </p>

        </div>

    </section>


</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

async function loadOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    try {


        const {
            data: {
                user
            },
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError || !user) {

            window.location.href =
                "laundry-login.html";

            return;

        }



        const {
            data: orders,
            error
        } =
            await supabaseClient

                .from("orders")

                .select("*")

                .eq(
                    "laundry_id",
                    user.id
                )

                .in(
                    "status",
                    [
                        "accepted",
                        "washing",
                        "ready"
                    ]
                )

                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            throw error;

        }



        if (
            !orders ||
            orders.length === 0
        ) {

            container.innerHTML = `

                <div class="dashboard-card">

                    <h2>
                        No Active Orders
                    </h2>

                    <p>
                        Accepted laundry orders
                        will appear here.
                    </p>

                </div>

            `;

            return;

        }



        container.innerHTML = "";



        orders.forEach(
            function(order) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "dashboard-card";


                card.style.marginBottom =
                    "20px";


                let nextStatus =
                    "";

                let buttonText =
                    "";


                if (
                    order.status ===
                    "accepted"
                ) {

                    nextStatus =
                        "washing";

                    buttonText =
                        "Start Washing";

                }

                else if (
                    order.status ===
                    "washing"
                ) {

                    nextStatus =
                        "ready";

                    buttonText =
                        "Mark as Ready";

                }

                else if (
                    order.status ===
                    "ready"
                ) {

                    nextStatus =
                        "delivered";

                    buttonText =
                        "Mark as Delivered";

                }



                card.innerHTML = `

                    <h2>
                        Laundry Order
                    </h2>


                    <p>
                        <strong>
                            Pickup:
                        </strong>

                        ${order.pickup_address}
                    </p>


                    <p>
                        <strong>
                            Order Status:
                        </strong>

                        ${formatStatus(
                            order.status
                        )}
                    </p>


                    <p>
                        <strong>
                            Requested:
                        </strong>

                        ${new Date(
                            order.created_at
                        ).toLocaleString()}
                    </p>


                    <button
                        class="dashboard-button"
                        onclick="updateStatus(
                            '${order.id}',
                            '${nextStatus}'
                        )"
                    >
                        ${buttonText}
                    </button>

                `;


                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="dashboard-card">

                <h2>
                    Unable to Load Orders
                </h2>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

    }

}



function formatStatus(status) {

    const names = {

        accepted:
            "Accepted",

        washing:
            "Washing",

        ready:
            "Ready",

        delivered:
            "Delivered"

    };


    return names[status] || status;

}



async function updateStatus(
    orderId,
    newStatus
) {

    try {


        const {
            data: {
                user
            },
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError || !user) {

            window.location.href =
                "laundry-login.html";

            return;

        }



        const {
            error
        } =
            await supabaseClient

                .from("orders")

                .update({

                    status:
                        newStatus

                })

                .eq(
                    "id",
                    orderId
                )

                .eq(
                    "laundry_id",
                    user.id
                );


        if (error) {

            throw error;

        }



        loadOrders();


    } catch (error) {

        console.error(error);


        alert(
            "Could not update order: " +
            error.message
        );

    }

}



loadOrders();

</script>


</body>

</html>
