<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Active Orders | TLogos</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <header class="header">

        <div class="logo">
            TLogos
        </div>

        <a
            href="laundry-dashboard.html"
            class="back-link"
        >
            ← Dashboard
        </a>

    </header>



    <main class="dashboard">

        <section class="dashboard-welcome">

            <h1>
                Active Orders
            </h1>

            <p>
                Manage laundry orders you have accepted.
            </p>

        </section>



        <section id="ordersContainer">

            <p>
                Loading active orders...
            </p>

        </section>

    </main>



    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <script>

        async function loadActiveOrders() {

            const container =
                document.getElementById(
                    "ordersContainer"
                );


            try {

                const {
                    data: {
                        user
                    },
                    error: userError
                } =
                    await supabaseClient.auth.getUser();


                if (userError || !user) {

                    window.location.href =
                        "login.html";

                    return;

                }


                const {
                    data: orders,
                    error
                } =
                    await supabaseClient
                        .from("orders")
                        .select("*")
                        .eq("laundry_id", user.id)
                        .neq("status", "delivered")
                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        );


                if (error) {

                    throw error;

                }


                if (!orders || orders.length === 0) {

                    container.innerHTML = `

                        <div class="dashboard-card">

                            <h2>
                                No Active Orders
                            </h2>

                            <p>
                                Orders you accept will
                                appear here.
                            </p>

                        </div>

                    `;

                    return;

                }


                container.innerHTML = "";


                orders.forEach(function(order) {

                    const card =
                        document.createElement("div");


                    card.className =
                        "dashboard-card";


                    card.innerHTML = `

                        <h2>
                            Order #${order.id.substring(0, 8)}
                        </h2>

                        <p>
                            <strong>Pickup:</strong>
                            ${order.pickup_address}
                        </p>

                        <p>
                            <strong>Status:</strong>
                            ${order.status}
                        </p>

                        <p>
                            <strong>Requested:</strong>
                            ${new Date(
                                order.created_at
                            ).toLocaleString()}
                        </p>


                        <div style="margin-top: 20px;">

                            ${
                                order.status === "accepted"
                                ? `
                                    <button
                                        class="dashboard-button"
                                        onclick="updateStatus(
                                            '${order.id}',
                                            'washing'
                                        )"
                                    >
                                        Start Washing
                                    </button>
                                `
                                : ""
                            }


                            ${
                                order.status === "washing"
                                ? `
                                    <button
                                        class="dashboard-button"
                                        onclick="updateStatus(
                                            '${order.id}',
                                            'ready'
                                        )"
                                    >
                                        Mark Ready
                                    </button>
                                `
                                : ""
                            }


                            ${
                                order.status === "ready"
                                ? `
                                    <button
                                        class="dashboard-button"
                                        onclick="updateStatus(
                                            '${order.id}',
                                            'delivered'
                                        )"
                                    >
                                        Mark Delivered
                                    </button>
                                `
                                : ""
                            }

                        </div>

                    `;


                    container.appendChild(card);

                });


            } catch (error) {

                console.error(error);


                container.innerHTML = `

                    <div class="dashboard-card">

                        <h2>
                            Unable to load orders
                        </h2>

                        <p>
                            ${error.message}
                        </p>

                    </div>

                `;

            }

        }



        async function updateStatus(
            orderId,
            newStatus
        ) {

            try {

                const {
                    data: {
                        user
                    },
                    error: userError
                } =
                    await supabaseClient.auth.getUser();


                if (userError || !user) {

                    window.location.href =
                        "login.html";

                    return;

                }


                const {
                    error
                } =
                    await supabaseClient
                        .from("orders")
                        .update({

                            status: newStatus

                        })
                        .eq("id", orderId)
                        .eq("laundry_id", user.id);


                if (error) {

                    throw error;

                }


                alert(
                    "Order status updated successfully!"
                );


                loadActiveOrders();


            } catch (error) {

                console.error(error);


                alert(
                    "Could not update order: " +
                    error.message
                );

            }

        }


        loadActiveOrders();

    </script>


</body>

</html>
