    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

<body>

<header>
    <div class="logo">TLogos</div>

    <a href="laundry-dashboard.html" class="back-btn">
        Dashboard
    </a>
</header>

<div class="container">

    <div class="page-title">
        <h1>Incoming Requests</h1>
        <p>View and accept new laundry requests from customers.</p>
    </div>

    <div id="message"></div>

    <div id="loading">
        Loading requests...
    </div>

    <div id="requestsContainer"></div>

</div>

<script>

    // ==============================
    // SUPABASE
    // ==============================

    const supabaseClient = window.supabaseClient;


    // ==============================
    // ELEMENTS
    // ==============================

    const loading = document.getElementById("loading");
    const requestsContainer = document.getElementById("requestsContainer");
    const messageBox = document.getElementById("message");


    // ==============================
    // MESSAGE FUNCTION
    // ==============================

    function showMessage(message, type) {

        messageBox.textContent = message;

        messageBox.className = "";

        messageBox.classList.add(type === "success"
            ? "success-message"
            : "error-message"
        );

        messageBox.style.display = "block";

        setTimeout(function() {
            messageBox.style.display = "none";
        }, 4000);
    }


    // ==============================
    // LOAD INCOMING REQUESTS
    // ==============================

    async function loadRequests() {

        loading.style.display = "block";

        requestsContainer.innerHTML = "";

        try {

            // Check logged-in laundry user
            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();


            if (userError || !user) {

                window.location.href = "laundry-login.html";

                return;
            }


            // Get requests assigned to this laundry
            const { data: requests, error } = await supabaseClient
                .from("orders")
                .select("*")
                .eq("laundry_id", user.id)
                .eq("status", "requested")
                .order("created_at", {
                    ascending: false
                });


            if (error) {

                console.error(error);

                requestsContainer.innerHTML = `
                    <div class="empty-state">
                        <h2>Unable to load requests</h2>
                        <p>
                            There was a problem loading incoming laundry requests.
                            Please try again.
                        </p>

                        <button class="refresh-btn" onclick="loadRequests()">
                            Try Again
                        </button>
                    </div>
                `;

                return;
            }


            loading.style.display = "none";


            // No requests
            if (!requests || requests.length === 0) {

                requestsContainer.innerHTML = `
                    <div class="empty-state">

                        <h2>No New Requests</h2>

                        <p>
                            You currently have no new laundry requests.
                            New customer requests will appear here.
                        </p>

                        <button class="refresh-btn" onclick="loadRequests()">
                            Refresh
                        </button>

                    </div>
                `;

                return;
            }


            // Display requests
            requests.forEach(function(request) {

                const card = document.createElement("div");

                card.className = "request-card";


                // ==============================
                // SERVICES
                // ==============================

                let servicesHTML = "";

                if (
                    request.laundry_types &&
                    Array.isArray(request.laundry_types) &&
                    request.laundry_types.length > 0
                ) {

                    request.laundry_types.forEach(function(service) {

                        servicesHTML += `
                            <span class="service-tag">
                                ${escapeHTML(service)}
                            </span>
                        `;

                    });

                } else {

                    servicesHTML = `
                        <span style="color:#6b7280;">
                            Not specified
                        </span>
                    `;
                }


                // ==============================
                // DATE
                // ==============================

                let orderDate = "Not available";

                if (request.created_at) {

                    orderDate = new Date(
                        request.created_at
                    ).toLocaleString();

                }


                // ==============================
                // CARD
                // ==============================

                card.innerHTML = `

                    <div class="order-reference-label">
                        Order Reference
                    </div>

                    <div class="order-reference">
                        ${escapeHTML(
                            request.order_reference ||
                            "TLogos Order"
                        )}
                    </div>


                    <div class="request-title">
                        New Laundry Request
                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            Services Requested
                        </span>

                        <div class="services-box">
                            ${servicesHTML}
                        </div>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            Pickup Address
                        </span>

                        <div class="address-box">
                            ${escapeHTML(
                                request.pickup_address ||
                                "Address not provided"
                            )}
                        </div>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            Request Date
                        </span>

                        ${escapeHTML(orderDate)}

                    </div>


                    <button
                        class="accept-btn"
                        onclick="acceptRequest('${request.id}', this)"
                    >
                        Accept Request
                    </button>

                `;


                requestsContainer.appendChild(card);

            });

        } catch (error) {

            console.error(error);

            loading.style.display = "none";

            requestsContainer.innerHTML = `
                <div class="empty-state">

                    <h2>Something went wrong</h2>

                    <p>
                        Please check your internet connection
                        and try again.
                    </p>

                    <button class="refresh-btn" onclick="loadRequests()">
                        Try Again
                    </button>

                </div>
            `;
        }
    }


    // ==============================
    // ACCEPT REQUEST
    // ==============================

    async function acceptRequest(orderId, button) {

        if (!orderId) {
            return;
        }


        // Prevent double clicking
        button.disabled = true;

        button.textContent = "Accepting...";


        try {

            // Get current laundry user
            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();


            if (userError || !user) {

                window.location.href = "laundry-login.html";

                return;
            }


            // Update the order
            const { error } = await supabaseClient
                .from("orders")
                .update({
                    status: "accepted"
                })
                .eq("id", orderId)
                .eq("laundry_id", user.id)
                .eq("status", "requested");


            if (error) {

                console.error(error);

                showMessage(
                    "Unable to accept this request. Please try again.",
                    "error"
                );

                button.disabled = false;

                button.textContent = "Accept Request";

                return;
            }


            // Success
            showMessage(
                "Laundry request accepted successfully.",
                "success"
            );


            // Reload requests
            setTimeout(function() {
                loadRequests();
            }, 700);


        } catch (error) {

            console.error(error);

            showMessage(
                "Something went wrong. Please try again.",
                "error"
            );

            button.disabled = false;

            button.textContent = "Accept Request";
        }
    }


    // ==============================
    // ESCAPE HTML
    // ==============================

    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // ==============================
    // REALTIME UPDATES
    // ==============================

    supabaseClient
        .channel("laundry-incoming-requests")
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "orders"
            },
            function(payload) {

                console.log(
                    "Order update received:",
                    payload
                );

                loadRequests();

            }
        )
        .subscribe();


    // ==============================
    // START
    // ==============================

    loadRequests();

</script>

</body>
</html>
