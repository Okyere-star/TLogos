<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders | TLogos</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff9e6;
            color: #171717;
            min-height: 100vh;
        }

        header {
            background: #f5b800;
            padding: 18px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
        }

        .back-btn {
            text-decoration: none;
            color: #171717;
            background: white;
            padding: 9px 15px;
            border-radius: 8px;
            font-weight: 600;
        }

        .container {
            width: 92%;
            max-width: 850px;
            margin: 35px auto;
        }

        .page-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #6b7280;
        }

        #loading {
            text-align: center;
            padding: 35px;
            color: #6b7280;
        }

        #ordersContainer {
            width: 100%;
        }

        .order-card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        .order-reference-label {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .order-reference {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 18px;
        }

        .info-row {
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .info-label {
            display: block;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .services-box,
        .address-box {
            background: #fff9e6;
            padding: 11px 13px;
            border-radius: 9px;
        }

        .service-tag {
            display: inline-block;
            background: #f5b800;
            padding: 6px 10px;
            margin: 3px 4px 3px 0;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-heading {
            font-weight: 700;
            margin-top: 22px;
            margin-bottom: 18px;
        }

        /* TRACKER */

        .tracker {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 10px 5px 5px;
        }

        .tracker::before {
            content: "";
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            height: 4px;
            background: #e5e7eb;
            z-index: 0;
        }

        .tracker-progress {
            position: absolute;
            top: 15px;
            left: 0;
            height: 4px;
            background: #f5b800;
            z-index: 1;
            transition: width 0.4s ease;
        }

        .tracker-step {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 20%;
        }

        .tracker-circle {
            width: 30px;

            margin: 0 auto 7px;

            box-shadow: 0 0 0 1px #d1d5db;
        }

        .tracker-step.active .tracker-circle,
        .tracker-step.completed .tracker-circle {

        }

        .tracker-step.current .tracker-circle {
            box-shadow: 0 0 0 3px rgba(245,184,0,0.25);
        }

        .tracker-label {

        .tracker-step.current .tracker-label {

        }

        .current-status {

            margin-top: 18px;
            padding: 11px;
            background: #fff4bf;

        }

        .empty-state {
            background: white;
            border-radius: 16px;
            text-align: center;
            padding: 45px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .empty-state h2 {
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #6b7280;
            line-height: 1.5;
        }

        .refresh-btn {
            margin-top: 18px;
            border: none;
            background: #f5b800;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #f5b800;
            font-size: 13px;
            font-weight: 700;
            text-transform: capitalize;
        }

        @media (max-width: 600px) {

            header {
                padding: 15px 5%;
            }

            .logo {
                font-size: 21px;
            }

            .container {
                width: 94%;
                margin-top: 25px;
            }

            .page-title h1 {
                font-size: 25px;
            }

            .order-card {
                padding: 18px;
            }

            .order-reference {
                font-size: 19px;
            }

            .tracker {
                margin-left: 0;
                margin-right: 0;
            }

            .tracker-label {
                font-size: 9px;
            }

            .tracker-circle {
                width: 26px;
                height: 26px;
            }

            .tracker::before,
            .tracker-progress {
                top: 13px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        TLogos
    </div>

    <a
        href="customer-dashboard.html"
        class="back-btn"
    >
        Dashboard
    </a>

</header>


<div class="container">

    <div class="page-title">

        <h1>
            My Orders
        </h1>

        <p>
            Track your laundry orders from request to delivery.
        </p>

    </div>


    <div id="loading">
        Loading your orders...
    </div>


    <div id="ordersContainer"></div>

</div>


<script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const supabaseClient = window.supabaseClient;


    // ==========================================
    // ELEMENTS
    // ==========================================

    const loading =
        document.getElementById("loading");

    const ordersContainer =
        document.getElementById("ordersContainer");


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // ==========================================
    // STATUS INFORMATION
    // ==========================================

    const statuses = [
        "requested",
        "accepted",
        "washing",
        "ready",
        "delivered"
    ];


    const statusLabels = {
        requested: "Requested",
        accepted: "Accepted",
        washing: "Washing",
        ready: "Ready",
        delivered: "Delivered"
    };


    // ==========================================
    // GET STATUS INDEX
    // ==========================================

    function getStatusIndex(status) {

        const index =
            statuses.indexOf(status);

        return index >= 0 ? index : 0;
    }


    // ==========================================
    // CREATE TRACKER
    // ==========================================

    function createTracker(status) {

        const currentIndex =
            getStatusIndex(status);


        const progressPercentage =
            (currentIndex / (statuses.length - 1)) * 100;


        let html = `

            <div class="tracker">

                <div
                    class="tracker-progress"
                    style="width:${progressPercentage}%"
                ></div>

        `;


        statuses.forEach(function(
            statusName,
            index
        ) {

            let className = "";


            if (index < currentIndex) {

                className =
                    "completed active";

            } else if (index === currentIndex) {

                className =
                    "current active";

            }


            html += `

                <div
                    class="tracker-step ${className}"
                >

                    <div class="tracker-circle"></div>

                    <div class="tracker-label">
                        ${statusLabels[statusName]}
                    </div>

                </div>

            `;

        });


        html += `
            </div>
        `;


        return html;
    }


    // ==========================================
    // CREATE SERVICE TAGS
    // ==========================================

    function createServices(laundryTypes) {

        if (
            !laundryTypes ||
            !Array.isArray(laundryTypes) ||
            laundryTypes.length === 0
        ) {

            return `
                <span style="color:#6b7280;">
                    Not specified
                </span>
            `;
        }


        return laundryTypes
            .map(function(service) {

                return `
                    <span class="service-tag">
                        ${escapeHTML(service)}
                    </span>
                `;

            })
            .join("");
    }


    // ==========================================
    // LOAD CUSTOMER ORDERS
    // ==========================================

    async function loadOrders() {

        loading.style.display = "block";

        ordersContainer.innerHTML = "";


        try {

            // Get logged-in customer

            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();


            if (
                userError ||
                !user
            ) {

                window.location.href =
                    "login.html";

                return;
            }


            // Get orders

            const {
                data: orders,
                error
            } = await supabaseClient
                .from("orders")
                .select("*")
                .eq("customer_id", user.id)
                .order("created_at", {
                    ascending: false
                });


            if (error) {

                console.error(error);

                loading.style.display = "none";

                ordersContainer.innerHTML = `

                    <div class="empty-state">

                        <h2>
                            Unable to load orders
                        </h2>

                        <p>
                            We couldn't retrieve your orders.
                            Please try again.
                        </p>

                        <button
                            class="refresh-btn"
                            onclick="loadOrders()"
                        >
                            Try Again
                        </button>

                    </div>

                `;

                return;
            }


            loading.style.display = "none";


            // No orders

            if (
                !orders ||
                orders.length === 0
            ) {

                ordersContainer.innerHTML = `

                    <div class="empty-state">

                        <h2>
                            No Orders Yet
                        </h2>

                        <p>
                            You haven't placed a laundry
                            request yet.
                        </p>

                        <button
                            class="refresh-btn"
                            onclick="goToRequest()"
                        >
                            Request Laundry
                        </button>

                    </div>

                `;

                return;
            }


            // Display orders

            orders.forEach(function(order) {

                const card =
                    document.createElement("div");

                card.className =
                    "order-card";


                const servicesHTML =
                    createServices(
                        order.laundry_types
                    );


                const trackerHTML =
                    createTracker(
                        order.status
                    );


                const orderDate =
                    order.created_at
                        ? new Date(
                            order.created_at
                        ).toLocaleString()
                        : "Not available";


                const currentStatus =
                    statusLabels[
                        order.status
                    ] ||
                    "Requested";


                card.innerHTML = `

                    <div class="order-reference-label">
                        Order Reference
                    </div>

                    <div class="order-reference">
                        ${escapeHTML(
                            order.order_reference ||
                            "TLogos Order"
                        )}
                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            Services Requested
                        </span>

                        <div class="services-box">
                            ${servicesHTML}
                        </div>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            Pickup Address
                        </span>

                        <div class="address-box">

                            ${escapeHTML(
                                order.pickup_address ||
                                "Not provided"
                            )}

                        </div>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            Order Date
                        </span>

                        ${escapeHTML(orderDate)}

                    </div>


                    <div class="status-heading">
                        Order Progress
                    </div>


                    ${trackerHTML}


                    <div class="current-status">

                        Current Status:
                        ${escapeHTML(currentStatus)}

                    </div>

                `;


                ordersContainer.appendChild(card);

            });


        } catch (error) {

            console.error(error);

            loading.style.display = "none";

            ordersContainer.innerHTML = `

                <div class="empty-state">

                    <h2>
                        Something went wrong
                    </h2>

                    <p>
                        Please check your internet
                        connection and try again.
                    </p>

                    <button
                        class="refresh-btn"
                        onclick="loadOrders()"
                    >
                        Try Again
                    </button>

                </div>

            `;
        }
    }


    // ==========================================
    // REQUEST LAUNDRY
    // ==========================================

    function goToRequest() {

        window.location.href =
            "request-laundry.html";

    }


    // ==========================================
    // REALTIME ORDER UPDATES
    // ==========================================

    supabaseClient
        .channel("customer-order-updates")
        .on(
            "postgres_changes",
            {
                event: "UPDATE",
                schema: "public",
                table: "orders"
            },
            function(payload) {

                console.log(
                    "Order status updated:",
                    payload
                );

                loadOrders();

            }
        )
        .subscribe();


    // ==========================================
    // START
    // ==========================================

    loadOrders();

</script>

</body>
</html>
