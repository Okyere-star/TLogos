<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders | TLogos</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .order-card {
            background: #ffffff;
            border: 1px solid #f3e7b3;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
        }


        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }


        .order-number {
            font-size: 18px;
            font-weight: 700;
        }


        .status-label {
            background: #fff4bf;
            color: #8a6500;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }


        .tracking {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 35px 0;
        }


        .tracking::before {
            content: "";
            position: absolute;
            top: 18px;
            left: 8%;
            right: 8%;
            height: 3px;
            background: #e5e7eb;
            z-index: 0;
        }


        .tracking-step {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 20%;
        }


        .tracking-circle {
            width: 36px;
            height: 36px;
            margin: 0 auto 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #e5e7eb;
            color: #6b7280;

            font-weight: 700;
        }


        .tracking-step.active
        .tracking-circle {

            background: #f5b800;
            color: #171717;

        }


        .tracking-step.completed
        .tracking-circle {

            background: #d99d00;
            color: #ffffff;

        }


        .tracking-text {
            font-size: 12px;
            color: #6b7280;
        }


        .tracking-step.active
        .tracking-text {

            color: #171717;
            font-weight: 700;

        }


        .order-details {
            border-top: 1px solid #eeeeee;
            padding-top: 18px;
        }


        .order-details p {
            margin: 7px 0;
        }


        @media (max-width: 600px) {

            .order-card {
                padding: 20px 15px;
            }

            .tracking-text {
                font-size: 10px;
            }

            .tracking-circle {
                width: 32px;
                height: 32px;
                font-size: 12px;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="logo">
        TLogos
    </div>

    <a
        href="customer-dashboard.html"
        class="back-link"
    >
        ← Dashboard
    </a>

</header>



<main class="dashboard">


    <section class="dashboard-welcome">

        <h1>
            My Orders 📦
        </h1>

        <p>
            Track your laundry from pickup to delivery.
        </p>

    </section>



    <section id="ordersContainer">

        <div class="dashboard-card">

            <p>
                Loading your orders...
            </p>

        </div>

    </section>


</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const statusSteps = [

    "requested",

    "accepted",

    "washing",

    "ready",

    "delivered"

];


function formatStatus(status) {

    const names = {

        requested:
            "Request Sent",

        accepted:
            "Accepted",

        washing:
            "Washing",

        ready:
            "Ready",

        delivered:
            "Delivered"

    };


    return names[status] || status;

}



function getTrackingHTML(
    currentStatus
) {

    const currentIndex =
        statusSteps.indexOf(
            currentStatus
        );


    const labels = [

        "Requested",

        "Accepted",

        "Washing",

        "Ready",

        "Delivered"

    ];


    let html =
        '<div class="tracking">';


    statusSteps.forEach(
        function(status, index) {

            let className =
                "tracking-step";


            if (
                index <
                currentIndex
            ) {

                className +=
                    " completed";

            }


            if (
                index ===
                currentIndex
            ) {

                className +=
                    " active";

            }


            html += `

                <div class="${className}">

                    <div class="tracking-circle">

                        ${index + 1}

                    </div>

                    <div class="tracking-text">

                        ${labels[index]}

                    </div>

                </div>

            `;

        }
    );


    html +=
        "</div>";


    return html;

}



async function loadOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    try {


        const {
            data: {
                user
            },
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (
            userError ||
            !user
        ) {

            window.location.href =
                "login.html";

            return;

        }



        const {
            data: orders,
            error
        } =
            await supabaseClient

                .from("orders")

                .select("*")

                .eq(
                    "customer_id",
                    user.id
                )

                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            throw error;

        }



        if (
            !orders ||
            orders.length === 0
        ) {

            container.innerHTML = `

                <div class="dashboard-card">

                    <h2>
                        No Orders Yet
                    </h2>

                    <p>
                        Your laundry requests
                        will appear here.
                    </p>

                    <button
                        class="dashboard-button"
                        onclick="
                            window.location.href =
                            'request-laundry.html'
                        "
                        style="margin-top:15px;"
                    >
                        Request Laundry
                    </button>

                </div>

            `;

            return;

        }



        container.innerHTML = "";



        orders.forEach(
            function(order) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "order-card";


                card.innerHTML = `

                    <div class="order-header">

                        <div class="order-number">

    ${order.order_reference || "TLogos Order"}

</div>

                        </div>

                        <div class="status-label">

                            ${formatStatus(
                                order.status
                            )}

                        </div>

                    </div>


                    ${getTrackingHTML(
                        order.status
                    )}


                    <div class="order-details">

                        <p>

                            <strong>
                                Pickup:
                            </strong>

                            ${order.pickup_address}

                        </p>


                        <p>

                            <strong>
                                Requested:
                            </strong>

                            ${new Date(
                                order.created_at
                            ).toLocaleString()}

                        </p>

                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="dashboard-card">

                <h2>
                    Unable to Load Orders
                </h2>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

    }

}



loadOrders();



const {
    data: orderChannel
} =
    supabaseClient

        .channel(
            "customer-orders"
        )

        .on(

            "postgres_changes",

            {

                event:
                    "UPDATE",

                schema:
                    "public",

                table:
                    "orders"

            },

            function() {

                loadOrders();

            }

        )

        .subscribe();

</script>


</body>

</html>
