<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laundry Login | TLogos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        TLogos
    </div>

    <a href="laundry-access.html" class="back-link">
        ← Back
    </a>

</header>


<main class="form-page">

    <div class="form-card">

        <h1>Laundry Login</h1>

        <p class="form-intro">
            Login to manage your laundry business on TLogos.
        </p>


        <form id="laundryLoginForm">

            <div class="form-group">

                <label for="laundryLoginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="laundryLoginEmail"
                    placeholder="Enter your business email"
                    required>

            </div>


            <div class="form-group">

                <label for="laundryLoginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="laundryLoginPassword"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                type="submit"
                class="form-button">

                Login to TLogos

            </button>

        </form>


        <p class="form-footer">

            Don't have a laundry account?

            <a href="laundry.html">
                Register Your Laundry
            </a>

        </p>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

document
    .getElementById("laundryLoginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("laundryLoginEmail")
                .value
                .trim();


        const password =
            document
                .getElementById("laundryLoginPassword")
                .value;


        const button =
            document.querySelector(".form-button");


        button.disabled = true;

        button.textContent =
            "Logging in...";


        try {

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .signInWithPassword({

                        email: email,
                        password: password

                    });


            if (error) {

                throw error;

            }


            if (!data.user) {

                throw new Error(
                    "Login was not successful."
                );

            }


            alert(
                "Laundry login successful!"
            );


            window.location.href =
                "laundry-dashboard.html";


        } catch (error) {

            console.error(error);


            alert(
                "Login failed: " +
                error.message
            );


            button.disabled = false;

            button.textContent =
                "Login to TLogos";

        }

    });

</script>

</body>

</html>
