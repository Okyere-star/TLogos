<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Laundry Dashboard | TLogos</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <header class="header">

        <div class="logo">
            TLogos
        </div>

        <button
            id="logoutButton"
            class="logout-button"
        >
            Logout
        </button>

    </header>



    <main class="dashboard">


        <section class="dashboard-welcome">

            <h1>
                Laundry Dashboard 🧺
            </h1>

            <p id="businessName">
                Loading your business...
            </p>

        </section>



        <section class="dashboard-grid">


            <div class="dashboard-card">

                <div class="dashboard-icon">
                    📥
                </div>

                <h2>
                    Incoming Requests
                </h2>

                <p>
                    View new customers looking for laundry services.
                </p>

                <button
                    class="dashboard-button"
                    onclick="viewRequests()"
                >
                    View Requests
                </button>

            </div>



            <div class="dashboard-card">

                <div class="dashboard-icon">
                    📦
                </div>

                <h2>
                    Active Orders
                </h2>

                <p>
                    Manage laundry orders currently in progress.
                </p>

                <button
                    class="dashboard-button"
                    onclick="viewOrders()"
                >
                    View Orders
                </button>

            </div>



            <div class="dashboard-card">

                <div class="dashboard-icon">
                    💰
                </div>

                <h2>
                    Earnings
                </h2>

                <p>
                    View your completed orders and earnings.
                </p>

                <button
                    class="dashboard-button"
                    onclick="viewEarnings()"
                >
                    View Earnings
                </button>

            </div>



            <div class="dashboard-card">

                <div class="dashboard-icon">
                    ⭐
                </div>

                <h2>
                    Reviews
                </h2>

                <p>
                    See customer ratings and reviews.
                </p>

                <button
                    class="dashboard-button"
                    onclick="viewReviews()"
                >
                    View Reviews
                </button>

            </div>


        </section>

    </main>



    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <script>

        async function loadLaundry() {

            const {
                data: {
                    user
                },
                error
            } = await supabaseClient.auth.getUser();


            if (error || !user) {

                window.location.href =
                    "login.html";

                return;

            }


            const {
                data: laundry,
                error: laundryError
            } = await supabaseClient
                .from("laundries")
                .select("business_name, status")
                .eq("id", user.id)
                .single();


            if (laundryError) {

                console.error(laundryError);

                document.getElementById(
                    "businessName"
                ).textContent =
                    "Welcome to TLogos";

                return;

            }


            document.getElementById(
                "businessName"
            ).textContent =
                laundry.business_name;


            if (laundry.status === "pending") {

                document.getElementById(
                    "businessName"
                ).textContent =
                    laundry.business_name +
                    " • Verification pending";

            }

        }



        document
            .getElementById("logoutButton")
            .addEventListener("click", async function() {

                await supabaseClient.auth.signOut();

                window.location.href =
                    "login.html";

            });


function viewRequests() {

    window.location.href =
        "laundry-requests.html";

}

function viewOrders() {
    window.location.href = "my-orders.html";
}


        function viewEarnings() {

            alert(
                "Earnings section will be built next!"
            );

        }



        function viewReviews() {

            alert(
                "Reviews section will be built next!"
            );

        }



        loadOrders();

const {
    data: orderChannel
} = supabaseClient
    .channel("customer-orders")
    .on(
        "postgres_changes",
        {
            event: "UPDATE",
            schema: "public",
            table: "orders"
        },
        function(payload) {

            loadOrders();

        }
    )
    .subscribe();

    </script>


</body>

</html>
