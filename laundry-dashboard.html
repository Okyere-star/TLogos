<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laundry Dashboard | TLogos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        TLogos
    </div>

    <button
        class="back-link"
        onclick="logout()">
        Logout
    </button>

</header>

<main class="dashboard">

    <section class="dashboard-welcome">

        <h1 id="businessName">
            Welcome
        </h1>

        <p>
            Manage your laundry business on TLogos.
        </p>

        <p
            id="verificationStatus"
            style="margin-top:10px;">
        </p>

    </section>


    <section class="dashboard-grid">

        <div class="dashboard-card">

            <h2>📥 Incoming Requests</h2>

            <p>
                View laundry requests from customers.
            </p>

            <button
                class="dashboard-button"
                onclick="viewRequests()">
                View Requests
            </button>

        </div>


        <div class="dashboard-card">

            <h2>🧺 Active Orders</h2>

            <p>
                Manage accepted laundry orders.
            </p>

            <button
                class="dashboard-button"
                onclick="viewActiveOrders()">
                View Orders
            </button>

        </div>


        <div class="dashboard-card">

            <h2>💰 Earnings</h2>

            <p>
                Track your laundry earnings.
            </p>

            <button
                class="dashboard-button"
                onclick="viewEarnings()">
                View Earnings
            </button>

        </div>


        <div class="dashboard-card">

            <h2>⭐ Reviews</h2>

            <p>
                See what customers are saying.
            </p>

            <button
                class="dashboard-button"
                onclick="viewReviews()">
                View Reviews
            </button>

        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

async function loadLaundryProfile() {

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();


    if (userError || !user) {

        window.location.href =
            "laundry-login.html";

        return;
    }


    const {
        data: laundry,
        error
    } = await supabaseClient
        .from("laundries")
        .select("*")
        .eq("id", user.id)
        .single();


    if (error) {

        console.error(error);

        document.getElementById(
            "businessName"
        ).textContent =
            "Laundry Dashboard";

        return;
    }


    document.getElementById(
        "businessName"
    ).textContent =
        "Welcome, " + laundry.business_name;


    const status =
        document.getElementById(
            "verificationStatus"
        );


    if (laundry.status === "approved") {

        status.textContent =
            "✓ Your laundry is approved.";

    } else {

        status.textContent =
            "⏳ Verification pending.";

    }

}


async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "index.html";

}


function viewRequests() {

    window.location.href =
        "laundry-requests.html";

}


function viewActiveOrders() {

    window.location.href =
        "laundry-active-orders.html";

}


function viewEarnings() {

    alert(
        "Earnings section coming next!"
    );

}


function viewReviews() {

    alert(
        "Reviews section coming next!"
    );

}


loadLaundryProfile();

</script>

</body>

</html>
