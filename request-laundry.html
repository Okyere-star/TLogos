<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Incoming Requests | TLogos</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

    <div class="logo">
        TLogos
    </div>

    <a
        href="laundry-dashboard.html"
        class="back-link"
    >
        ← Dashboard
    </a>

</header>



<main class="dashboard">


    <section class="dashboard-welcome">

        <h1>
            Incoming Requests 📥
        </h1>

        <p>
            Laundry requests assigned to your business.
        </p>

    </section>



    <section id="requestsContainer">

        <div class="dashboard-card">

            <p>
                Loading requests...
            </p>

        </div>

    </section>


</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

async function loadRequests() {

    const container =
        document.getElementById(
            "requestsContainer"
        );


    try {


        const {
            data: {
                user
            },
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError || !user) {

            window.location.href =
                "laundry-login.html";

            return;

        }



        const {
            data: requests,
            error
        } =
            await supabaseClient

                .from("orders")

                .select("*")

                .eq(
                    "laundry_id",
                    user.id
                )

                .eq(
                    "status",
                    "requested"
                )

                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            throw error;

        }



        if (
            !requests ||
            requests.length === 0
        ) {

            container.innerHTML = `

                <div class="dashboard-card">

                    <h2>
                        No Incoming Requests
                    </h2>

                    <p>
                        New customer requests
                        assigned to your laundry
                        will appear here.
                    </p>

                </div>

            `;

            return;

        }



        container.innerHTML = "";



        requests.forEach(
            function(request) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "dashboard-card";


                card.style.marginBottom =
                    "20px";


                card.innerHTML = `

                <p style="font-size: 13px; color: #6b7280; margin-bottom: 5px;">
    Order Reference
</p>

<h2 style="margin-top: 0;">
    ${request.order_reference || "TLogos Order"}
</h2>

<p>
    <strong>
        New Laundry Request
    </strong>
</p>

                    <p>
                        <strong>
                            Pickup Location:
                        </strong>

                        ${request.pickup_address}
                    </p>


                    <p>
                        <strong>
                            Requested:
                        </strong>

                        ${new Date(
                            request.created_at
                        ).toLocaleString()}
                    </p>


                    <p>
                        <strong>
                            Status:
                        </strong>

                        ${request.status}
                    </p>


                    <button
                        class="dashboard-button"
                        onclick="acceptRequest(
                            '${request.id}'
                        )"
                    >
                        Accept Request
                    </button>

                `;


                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="dashboard-card">

                <h2>
                    Unable to Load Requests
                </h2>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

    }

}



async function acceptRequest(orderId) {

    try {


        const {
            data: {
                user
            },
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError || !user) {

            window.location.href =
                "laundry-login.html";

            return;

        }



        const {
            error
        } =
            await supabaseClient

                .from("orders")

                .update({

                    status: "accepted"

                })

                .eq(
                    "id",
                    orderId
                )

                .eq(
                    "laundry_id",
                    user.id
                )

                .eq(
                    "status",
                    "requested"
                );


        if (error) {

            throw error;

        }



        alert(
            "Request accepted successfully!"
        );


        loadRequests();


    } catch (error) {

        console.error(error);


        alert(
            "Could not accept request: " +
            error.message
        );

    }

}



loadRequests();

</script>


</body>

</html>
