```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Request Laundry | TLogos</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .laundry-card {
            background: #ffffff;
            border: 1px solid #f3e7b3;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .laundry-card h2 {
            margin-top: 0;
        }

        .distance {
            color: #8a6500;
            font-weight: 700;
        }

        .location-status {
            background: #fff4bf;
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .request-button {
            width: 100%;
            margin-top: 15px;
        }

        .form-group textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
        }

    </style>

</head>


<body>


<header class="header">

    <div class="logo">
        TLogos
    </div>

    <a
        href="customer-dashboard.html"
        class="back-link"
    >
        ← Dashboard
    </a>

</header>



<main class="form-page">


    <div class="form-card">


        <h1>
            Request Laundry 🧺
        </h1>


        <p class="form-intro">
            Tell us what you need and we will find
            nearby laundry businesses for you.
        </p>



        <div class="form-group">

            <label for="pickupAddress">
                Pickup Address
            </label>

            <input
                type="text"
                id="pickupAddress"
                placeholder="Enter your pickup address"
                required
            >

        </div>


<div class="form-group">

    <label>
        Laundry Services
    </label>

    <p style="font-size: 14px; color: #6b7280;">
        Select all the services you need.
    </p>


    <label style="display:block; margin:10px 0;">

        <input
            type="checkbox"
            name="laundryType"
            value="Washing"
        >

        Washing

    </label>


    <label style="display:block; margin:10px 0;">

        <input
            type="checkbox"
            name="laundryType"
            value="Ironing"
        >

        Ironing

    </label>


    <label style="display:block; margin:10px 0;">

        <input
            type="checkbox"
            name="laundryType"
            value="Washing and Ironing"
        >

        Washing & Ironing

    </label>


    <label style="display:block; margin:10px 0;">

        <input
            type="checkbox"
            name="laundryType"
            value="Bedding"
        >

        Bedding

    </label>


    <label style="display:block; margin:10px 0;">

        <input
            type="checkbox"
            name="laundryType"
            value="Shoes"
        >

        Shoe Cleaning

    </label>


    <label style="display:block; margin:10px 0;">

        <input
            type="checkbox"
            name="laundryType"
            value="Other"
        >

        Other

    </label>

</div>


        <div class="form-group">

            <label for="description">
                Additional Details
            </label>

            <textarea
                id="description"
                placeholder="Tell the laundry business anything important about your order..."
            ></textarea>

        </div>



        <div class="location-status" id="locationStatus">

            📍 Your location will be used to find
            nearby laundries.

        </div>



        <button
            class="form-button"
            id="findLaundryButton"
        >
            Find Nearby Laundries
        </button>


    </div>



    <div
        id="laundriesContainer"
        style="margin-top:25px;"
    >

    </div>


</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>


let customerLatitude = null;

let customerLongitude = null;



async function checkCustomerLogin() {

    const {
        data: {
            user
        },
        error
    } =
        await supabaseClient.auth.getUser();


    if (error || !user) {

        window.location.href =
            "login.html";

        return false;

    }

    return true;

}



async function findNearbyLaundries() {


    const loggedIn =
        await checkCustomerLogin();


    if (!loggedIn) {

        return;

    }



    const pickupAddress =
        document
            .getElementById("pickupAddress")
            .value
            .trim();

const selectedLaundryTypes =
    Array.from(
        document.querySelectorAll(
            'input[name="laundryType"]:checked'
        )
    ).map(
        function(checkbox) {
            return checkbox.value;
        }
    );

    if (!pickupAddress) {

        alert(
            "Please enter your pickup address."
        );

        return;

    }

if (selectedLaundryTypes.length === 0) {

    alert(
        "Please select at least one laundry service."
    );

    return;

}



    const button =
        document.getElementById(
            "findLaundryButton"
        );


    const status =
        document.getElementById(
            "locationStatus"
        );


    const container =
        document.getElementById(
            "laundriesContainer"
        );



    button.disabled = true;

    button.textContent =
        "Finding nearby laundries...";



    container.innerHTML = "";



    if (!navigator.geolocation) {

        alert(
            "Location services are not supported by your browser."
        );

        button.disabled = false;

        button.textContent =
            "Find Nearby Laundries";

        return;

    }



    try {


        status.textContent =
            "📍 Getting your current location...";



        const position =
            await new Promise(
                function(resolve, reject) {

                    navigator.geolocation.getCurrentPosition(
                        resolve,
                        reject,
                        {
                            enableHighAccuracy: true,
                            timeout: 15000,
                            maximumAge: 0
                        }
                    );

                }
            );



        customerLatitude =
            position.coords.latitude;


        customerLongitude =
            position.coords.longitude;



        status.textContent =
            "📍 Location found. Searching for nearby laundries...";



        const {
            data: laundries,
            error
        } =
            await supabaseClient.rpc(
                "get_nearby_laundries",
                {
                    customer_lat:
                        customerLatitude,

                    customer_lng:
                        customerLongitude
                }
            );



        if (error) {

            throw error;

        }



        button.disabled = false;

        button.textContent =
            "Find Nearby Laundries";



        if (
            !laundries ||
            laundries.length === 0
        ) {

            status.textContent =
                "📍 Location found, but no nearby approved laundries were found.";

            container.innerHTML = `

                <div class="dashboard-card">

                    <h2>
                        No Nearby Laundries
                    </h2>

                    <p>
                        There are currently no approved
                        laundry businesses serving your area.
                    </p>

                </div>

            `;

            return;

        }



        status.textContent =
            "📍 Nearby laundries found!";



        laundries.forEach(
            function(laundry) {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "laundry-card";



                card.innerHTML = `

                    <h2>
                        ${laundry.business_name}
                    </h2>


                    <p>
                        <strong>
                            Address:
                        </strong>

                        ${laundry.address || "Address not provided"}
                    </p>


                    <p class="distance">

                        📍
                        ${Number(
                            laundry.distance_km
                        ).toFixed(2)}
                        km away

                    </p>


                    <p>

                        Service radius:
                        ${laundry.service_radius}
                        km

                    </p>


                    <button
                        class="dashboard-button request-button"
                        onclick="requestLaundry(
                            '${laundry.id}'
                        )"
                    >
                        Request This Laundry
                    </button>

                `;


                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {


        console.error(error);


        button.disabled = false;

        button.textContent =
            "Find Nearby Laundries";


        status.textContent =
            "📍 Unable to find your location.";


        container.innerHTML = `

            <div class="dashboard-card">

                <h2>
                    Unable to Find Laundries
                </h2>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

    }

}



async function requestLaundry(
    laundryId
) {


    try {


        const {
            data: {
                user
            },
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (
            userError ||
            !user
        ) {

            window.location.href =
                "login.html";

            return;

        }



        const pickupAddress =
            document
                .getElementById(
                    "pickupAddress"
                )
                .value
                .trim();


        const laundryType =
            document
                .getElementById(
                    "laundryType"
                )
                .value;


        const description =
            document
                .getElementById(
                    "description"
                )
                .value
                .trim();



        if (
            !customerLatitude ||
            !customerLongitude
        ) {

            alert(
                "Please find nearby laundries first."
            );

            return;

        }



        const {
            data: order,
            error
        } =
            await supabaseClient

                .from("orders")

                .insert({

                    customer_id:
                        user.id,

                    laundry_id:
                        laundryId,

                    pickup_address:
                        pickupAddress,

                    pickup_latitude:
                        customerLatitude,

                    pickup_longitude:
                        customerLongitude,

                    status:
                        "requested"

                })

                .select()

                .single();



        if (error) {

            throw error;

        }



        console.log(
            "Laundry type:",
            laundryType
        );


        console.log(
            "Additional details:",
            description
        );


        alert(
            "Laundry request sent successfully!"
        );


        window.location.href =
            "my-orders.html";


    } catch (error) {


        console.error(error);


        alert(
            "Could not send laundry request: " +
            error.message
        );

    }

}



document
    .getElementById(
        "findLaundryButton"
    )
    .addEventListener(
        "click",
        findNearbyLaundries
    );



checkCustomerLogin();

</script>


</body>

</html>
