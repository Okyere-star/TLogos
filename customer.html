<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#f5b800">

    <title>TLogos - Customer Registration</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header class="top-bar">

        <div class="logo">
            TLogos
        </div>

        <button
            class="menu-btn"
            onclick="window.location.href='index.html'"
        >
            ←
        </button>

    </header>


    <main>

        <section class="registration-section">

            <div class="registration-card">

                <div class="registration-icon">
                    👤
                </div>

                <h1>
                    Create Your Account
                </h1>

                <p class="registration-intro">
                    Create an account to request laundry services
                    from providers near you.
                </p>


                <form id="customerForm">

                    <div class="form-group">

                        <label for="customerName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="customerName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="customerPhone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="customerPhone"
                            placeholder="e.g. 024 123 4567"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="customerEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="customerEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="customerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="customerPassword"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="customerLocation">
                            Your Location
                        </label>

                        <input
                            type="text"
                            id="customerLocation"
                            placeholder="e.g. Bomso, Kumasi"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="form-button"
                    >
                        Create Customer Account
                    </button>

                </form>


                <p class="switch-account">

                    Are you a laundry business?

                    <a href="laundry.html">
                        Register your laundry
                    </a>

                </p>


                <p class="back-home">

                    <a href="index.html">
                        ← Back to TLogos
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script>

        document
            .getElementById("customerForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                alert(
                    "Customer registration will be connected to the TLogos database next."
                );

            });

    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>

document
    .getElementById("customerForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("customerName").value.trim();

        const phone =
            document.getElementById("customerPhone").value.trim();

        const email =
            document.getElementById("customerEmail").value.trim();

        const password =
            document.getElementById("customerPassword").value;

        const location =
            document.getElementById("customerLocation").value.trim();
            let latitude = null;
let longitude = null;

if (navigator.geolocation) {

    try {

        const position = await new Promise(
            function(resolve, reject) {

                navigator.geolocation.getCurrentPosition(
                    resolve,
                    reject,
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );

            }
        );

        latitude =
            position.coords.latitude;

        longitude =
            position.coords.longitude;

    } catch (locationError) {

        console.warn(
            "Location could not be obtained:",
            locationError
        );

    }

}

            let latitude = null;
let longitude = null;

if (navigator.geolocation) {

    try {

        const position = await new Promise(
            function(resolve, reject) {

                navigator.geolocation.getCurrentPosition(
                    resolve,
                    reject,
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );

            }
        );

        latitude =
            position.coords.latitude;

        longitude =
            position.coords.longitude;

    } catch (locationError) {

        console.warn(
            "Location could not be obtained:",
            locationError
        );

    }

}

        const button =
            document.querySelector(".form-button");

        button.disabled = true;
        button.textContent = "Creating account...";


        try {

            // Create Supabase authentication account

            const {
                data: authData,
                error: authError
            } = await supabaseClient.auth.signUp({
                email: email,
                password: password
            });


            if (authError) {
                throw authError;
            }


            if (!authData.user) {
                throw new Error(
                    "The account could not be created."
                );
            }


            // Create customer profile

            const {
                error: profileError
            } = await supabaseClient
.from("customers")
.insert({
    id: authData.user.id,
    full_name: name,
    phone: phone,
    email: email,
    location: location,
    latitude: latitude,
    longitude: longitude
});

            if (profileError) {
                throw profileError;
            }


            alert(
                "Customer account created successfully!"
            );


            window.location.href =
                "customer-dashboard.html";


        } catch (error) {

            console.error(error);

            alert(
                "Registration failed: " +
                error.message
            );

            button.disabled = false;

            button.textContent =
                "Create Customer Account";

        }

    });

</script>
</body>

</html>
